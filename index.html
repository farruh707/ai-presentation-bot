<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Taqdimot Generator</title>
    <!-- Telegram Web App skripti -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        :root {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-color: #222222;
            --accent-color: #007aff;
            --border-color: #d1d1d6;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .header-icon {
            background-color: #1b365d;
            color: white;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-weight: bold;
            font-size: 18px;
        }

        h2 {
            margin: 0;
            font-size: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #1b365d;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            background-color: #fafafa;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-color);
            background-color: #fff;
        }

        .btn-group {
            margin-top: 20px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            background: #1b365d;
            color: white;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: 0.2s;
        }

        .btn:hover {
            background: #132743;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="header-icon">AI</div>
        <h2>Taqdimot yaratish</h2>
    </div>

    <div class="card">
        <div class="form-group">
            <label>Taqdimot mavzusini kiriting</label>
            <input type="text" id="mavzu" placeholder="Masalan: Sun'iy intellekt va kelajak">
        </div>
    </div>

    <div class="card">
        <div class="btn-group">
            <button class="btn" onclick="sendPresentationData()">✨ Taqdimotni yaratish</button>
        </div>
    </div>
</div>

<script>
    let tg = window.Telegram.WebApp;
    tg.expand();

    function sendPresentationData() {
        let mavzuVal = document.getElementById('mavzu').value.trim();
        
        if (!mavzuVal) {
            alert("Iltimos, taqdimot mavzusini kiriting!");
            return;
        }

        let data = {
            mavzu: mavzuVal
        };

        // Ma'lumotlarni botga yuborish va WebApp'ni yopish
        tg.sendData(JSON.stringify(data));
    }
</script>

</body>
</html>
