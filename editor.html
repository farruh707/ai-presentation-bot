<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taqdimot muharriri</title>
    <!-- Telegram Web App kutubxonasi -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .scrollbar-none::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="flex flex-col h-screen justify-between p-4">

    <!-- Yuqori qism: Sarlavha, masshtab va slayidlar raqami -->
    <div>
        <div class="flex justify-between items-center mb-2">
            <h1 class="text-base font-semibold text-slate-100">Taqdimot muharriri</h1>
            <div class="flex items-center space-x-2 bg-slate-800 px-2.5 py-1 rounded-lg text-xs text-slate-300">
                <button onclick="zoomOut()" class="px-1 text-slate-400 hover:text-white">-</button>
                <span id="zoom-level">100%</span>
                <button onclick="zoomIn()" class="px-1 text-slate-400 hover:text-white">+</button>
            </div>
        </div>
        <p id="slide-info" class="text-xs text-slate-400 mb-2">Slayd 1 / 1</p>

        <!-- Slaydlar raqamlari paneli (Pagination) -->
        <div id="slides-pagination" class="flex space-x-2 overflow-x-auto pb-2 scrollbar-none">
            <!-- Dinamik ravishda to'ldiriladi -->
        </div>
    </div>

    <!-- Markaziy qism: Slayd oynasi (Rasm va elementlar bilan) -->
    <div class="flex-grow flex flex-col justify-center items-center my-2 overflow-auto">
        <div id="slide-container" class="w-full max-w-xl bg-white text-slate-900 rounded-xl shadow-2xl p-4 flex flex-col justify-between relative aspect-[16/9] transition-all duration-300">
            <!-- Slayd foni yoki rasm -->
            <div id="slide-background" class="absolute inset-0 rounded-xl overflow-hidden flex items-center justify-center bg-slate-100">
                <img id="slide-image" src="" alt="Slayd rasmi" class="w-full h-full object-contain hidden">
                <div id="slide-placeholder-text" class="text-slate-400 text-sm">Slayd muhiti tayyor</div>
            </div>

            <!-- Matn va elementlar qatlami -->
            <div class="relative z-10 flex flex-col justify-between h-full p-2 pointer-events-none">
                <div class="pointer-events-auto">
                    <h2 id="slide-title" contenteditable="true" class="text-lg font-bold bg-white/80 backdrop-blur-sm p-1.5 rounded border border-transparent hover:border-slate-300 focus:border-blue-500 outline-none mb-2">
                        Anatomiya nervnoy sistemi
                    </h2>
                </div>
                <div class="pointer-events-auto">
                    <p id="slide-content" contenteditable="true" class="text-xs text-slate-700 bg-white/80 backdrop-blur-sm p-1.5 rounded border border-transparent hover:border-slate-300 focus:border-blue-500 outline-none">
                        Obshaya anatomiya, spinnoy mozg i vozrastnyye osobennosti
                    </p>
                </div>
            </div>
            
            <div class="absolute bottom-2 right-3 z-10 text-[10px] text-slate-400 bg-white/70 px-1.5 py-0.5 rounded">
                AI Slayd Master
            </div>
        </div>
    </div>

    <!-- Pastki boshqaruv paneli -->
    <div class="space-y-3">
        <!-- Amallar tugmalari (+ Matn va Rasm qo'shish) -->
        <div class="grid grid-cols-2 gap-3">
            <button onclick="addTextField()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium py-3 px-4 rounded-xl transition flex items-center justify-center space-x-2 text-sm shadow-md">
                <span>+ Matn</span>
            </button>
            <button onclick="addImageField()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium py-3 px-4 rounded-xl transition flex items-center justify-center space-x-2 text-sm shadow-md">
                <span>🖼 Rasm</span>
            </button>
        </div>

        <!-- Saqlash va yuborish tugmasi -->
        <button onclick="saveAndSend()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-4 px-6 rounded-2xl transition shadow-lg flex items-center justify-center space-x-2">
            <span>💾 Saqlash va yuborish</span>
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let currentZoom = 100;
        let slides = [
            { title: "Anatomiya nervnoy sistemi", content: "Obshaya anatomiya, spinnoy mozg i vozrastnyye osobennosti", image: "" },
            { title: "Spiyno-mozgovыe nervы", content: "Stroenie, funktsii i topografiya.", image: "" }
        ];
        let currentSlideIndex = 0;

        const paginationContainer = document.getElementById('slides-pagination');
        const slideTitle = document.getElementById('slide-title');
        const slideContent = document.getElementById('slide-content');
        const slideInfo = document.getElementById('slide-info');
        const slideImage = document.getElementById('slide-image');
        const placeholderText = document.getElementById('slide-placeholder-text');
        const slideContainer = document.getElementById('slide-container');
        const zoomLevelText = document.getElementById('zoom-level');

        function zoomIn() {
            if (currentZoom < 150) {
                currentZoom += 10;
                updateZoom();
            }
        }

        function zoomOut() {
            if (currentZoom > 70) {
                currentZoom -= 10;
                updateZoom();
            }
        }

        function updateZoom() {
            zoomLevelText.innerText = currentZoom + '%';
            slideContainer.style.transform = `scale(${currentZoom / 100})`;
        }

        function renderPagination() {
            paginationContainer.innerHTML = '';
            slides.forEach((slide, index) => {
                const btn = document.createElement('button');
                btn.className = `px-3.5 py-2 rounded-xl text-xs font-semibold transition flex-shrink-0 ${index === currentSlideIndex ? 'bg-blue-600 text-white shadow-md' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`;
                btn.innerText = index + 1;
                btn.onclick = () => switchSlide(index);
                paginationContainer.appendChild(btn);
            });
        }

        function switchSlide(index) {
            slides[currentSlideIndex].title = slideTitle.innerText;
            slides[currentSlideIndex].content = slideContent.innerText;

            currentSlideIndex = index;
            slideTitle.innerText = slides[currentSlideIndex].title;
            slideContent.innerText = slides[currentSlideIndex].content;
            slideInfo.innerText = `Slayd ${currentSlideIndex + 1} / ${slides.length}`;

            if (slides[currentSlideIndex].image) {
                slideImage.src = slides[currentSlideIndex].image;
                slideImage.classList.remove('hidden');
                placeholderText.classList.add('hidden');
            } else {
                slideImage.classList.add('hidden');
                placeholderText.classList.remove('hidden');
            }
            
            renderPagination();
        }

        function addTextField() {
            slideContent.innerText += "\n• Yangi qo'shimcha matn";
        }

        // Qурилмадан рәсем сайлап слайдка өстәү функциясе
        function addImageField() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = e => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        slides[currentSlideIndex].image = event.target.result;
                        slideImage.src = event.target.result;
                        slideImage.classList.remove('hidden');
                        placeholderText.classList.add('hidden');
                    }
                    reader.readAsDataURL(file);
                }
            };
            input.click();
        }

        function saveAndSend() {
            slides[currentSlideIndex].title = slideTitle.innerText;
            slides[currentSlideIndex].content = slideContent.innerText;

            const updatedData = JSON.stringify({
                action: "edit_presentation",
                slides: slides
            });

            tg.sendData(updatedData);
            tg.close();
        }

        renderPagination();
    </script>
</body>
</html>
