<script>
    let tg = window.Telegram.WebApp;
    tg.expand();

    function updatePreview() {
        document.getElementById('p-vazirlik').innerText = document.getElementById('vazirlik').value;
        document.getElementById('p-uni').innerText = document.getElementById('universitet').value;
        document.getElementById('p-fakultet').innerText = document.getElementById('fakultet').value;
        document.getElementById('p-kafedra').innerText = document.getElementById('kafedra').value;
        document.getElementById('p-fan-text').innerText = document.getElementById('fan').value ? document.getElementById('fan').value + " fanidan" : "";
        document.getElementById('p-ishturi').innerText = document.getElementById('ishturi').value;
        document.getElementById('p-mavzu').innerText = document.getElementById('mavzu').value;
        document.getElementById('p-talaba').innerText = document.getElementById('talaba').value;
        document.getElementById('p-guruh').innerText = "(" + document.getElementById('guruh').value + " guruh)";
        document.getElementById('p-ustoz').innerText = document.getElementById('ustoz').value;
        document.getElementById('p-lavozim').innerText = "(" + document.getElementById('lavozim').value + ")";
        document.getElementById('p-shahar').innerText = document.getElementById('shahar').value;
        document.getElementById('p-yil').innerText = document.getElementById('yil').value;
    }

    updatePreview();

    function downloadDOCX() {
        // Формируем чистый HTML-документ в формате Word (.doc)
        const content = `
            <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
            <head><meta charset='utf-8'><title>Titul</title>
            <style>
                body { font-family: 'Times New Roman', Times, serif; text-align: center; font-size: 14pt; line-height: 1.5; }
                .top { font-weight: bold; text-transform: uppercase; font-size: 12pt; }
                .middle { margin: 80px 0; }
                .title { font-size: 18pt; font-weight: bold; margin: 30px 0; text-transform: uppercase; }
            </style>
            </head>
            <body>
                <div class="top">${document.getElementById('vazirlik').value}</div><br>
                <b>${document.getElementById('universitet').value}</b><br>
                <div>${document.getElementById('fakultet').value}</div>
                <div>${document.getElementById('kafedra').value}</div>
                
                <div class="middle">
                    <br><br>
                    <div>${document.getElementById('fan').value} fanidan</div>
                    <div class="title">${document.getElementById('ishturi').value}</div>
                    <div>Mavzu: <u>${document.getElementById('mavzu').value}</u></div>
                </div>
                
                <table width="100%" style="margin-top: 150px; font-size: 14pt;">
                    <tr>
                        <td align="left">Bajardi: ${document.getElementById('talaba').value}<br><span style="font-size: 11pt; padding-left: 60px;">(${document.getElementById('guruh').value} guruh)</span></td>
                        <td align="right">Qabul qildi: ${document.getElementById('ustoz').value}<br><span style="font-size: 11pt; padding-left: 70px;">(${document.getElementById('lavozim').value})</span></td>
                    </tr>
                </table>
                
                <br><br><br><br>
                <b>${document.getElementById('shahar').value} — ${document.getElementById('yil').value}</b>
            </body>
            </html>
        `;

        const blob = new Blob(['\ufeff' + content], { type: 'application/msword' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'titul_varagi.doc';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }
</script>
